# Host ports are deliberately in the 19xxx range: IANA leaves it unassigned and
# Linux picks ephemeral ports from 32768+, so nothing here collides with a stock
# Postgres/Redis/Qdrant already on the box. Container-internal ports are
# unchanged -- service-to-service DNS still uses 5432/6379/6333/8000/9000.
#
# Override any of them in .env. INFRA_BIND keeps the datastores on loopback;
# set it to 0.0.0.0 only if you really need them reachable off-box.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stm32ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stm32ai}
      POSTGRES_DB: ${POSTGRES_DB:-stm32ai}
    ports:
      # Loopback only: the password defaults to `stm32ai`, so this must not be
      # world-reachable. `make`/scripts talk to it via `docker compose exec`.
      - "${INFRA_BIND:-127.0.0.1}:${POSTGRES_PORT:-19432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stm32ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
          # Unambiguous DNS name. The service name `postgres` collides on
          # rag-net: PageVault's stack names its default network `rag-net`
          # and exposes its own `postgres` there, and any container on both
          # networks (backend, worker) may resolve that one instead.
          - stm32-postgres

  redis:
    image: redis:7-alpine
    ports:
      # Loopback only: no auth configured.
      - "${INFRA_BIND:-127.0.0.1}:${REDIS_PORT:-19379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases:
          # Unambiguous DNS name. On rag-net the bare name `redis` belongs to
          # PageVault's redis, and any container on both networks (backend,
          # worker) may resolve that one -- which silently pointed our Celery
          # broker at the wrong server and made our worker steal PageVault's
          # tasks (every other embed_query died with NotRegistered).
          - stm32-redis

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      # Loopback only: no auth configured.
      - "${INFRA_BIND:-127.0.0.1}:${QDRANT_PORT:-19333}:6333"
      - "${INFRA_BIND:-127.0.0.1}:${QDRANT_GRPC_PORT:-19334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      default:
        aliases:
          # Same reason as redis: `qdrant` on rag-net is PageVault's.
          - stm32-qdrant

  backend:
    build: ./backend
    env_file: .env
    # `environment` wins over `env_file`, and Compose interpolates ${...} from
    # ./.env -- so setting CORS_ORIGINS in .env still works, and if you don't,
    # it tracks FRONTEND_PORT automatically instead of silently staying at 3000.
    # Must be a JSON array: pydantic-settings rejects a comma-separated list.
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:${FRONTEND_PORT:-19300}"]}
    ports:
      - "${BACKEND_PORT:-19800}:8000"
    volumes:
      - ./backend:/app
      # Generated projects live here. The builder mounts the same volume, so
      # source never travels over HTTP -- only the project id does.
      - workspaces:/workspaces
      # ST's HAL/CMSIS sources, downloaded into the builder image and shared
      # read-only. The scaffold copies the drivers each project needs out of
      # here, so git carries none of them. The pin tables ride along in the
      # same volume, under modm-devices/.
      - cube_sdk:/opt/stm32cube:ro
      # The per-part tables converted from those pin tables, and later the
      # chips imported from the admin panel. Writable, and deliberately not
      # inside the image: an imported chip must survive a rebuild.
      - device_data:/var/lib/stm32ai/devices
    networks:
      - default
      - rag-net
      - build-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      # Waiting for healthy also means the driver volume has been populated
      # from the builder image before anything tries to read it.
      builder:
        condition: service_healthy

  worker:
    build: ./backend
    # Agents query the knowledge base from inside the worker, so it needs the
    # shared network too. `-Q celery` is explicit on purpose: this worker must
    # only ever consume its own queue.
    command: celery -A app.workers.celery_app worker --loglevel=info -Q celery
    env_file: .env
    volumes:
      - ./backend:/app
      - workspaces:/workspaces
      - cube_sdk:/opt/stm32cube:ro
      - device_data:/var/lib/stm32ai/devices
    networks:
      - default
      - rag-net
      - build-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Compile sandbox (M4). Reachable only from the backend and the worker,
  # and able to reach nothing at all: a generated Makefile cannot download a
  # dependency, phone home, or touch the database. Resource limits are there
  # because a generated project can also just be an infinite loop.
  builder:
    build: ./deploy/builder
    environment:
      WORKSPACE_ROOT: /workspaces
      BUILD_TIMEOUT_SECONDS: ${BUILD_TIMEOUT_SECONDS:-120}
    volumes:
      - workspaces:/workspaces
      # Docker fills this volume from the image the first time the container
      # starts, which is how the drivers reach the backend without git and
      # without a network call at runtime.
      - cube_sdk:/opt/stm32cube
    networks:
      - build-net
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 2g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-19300}:3000"
    environment:
      # Baked into the browser bundle, so it must be the URL the *user's*
      # browser can reach -- not a container name. Tracks BACKEND_PORT unless
      # you set it explicitly (which you must, for a non-localhost server).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${BACKEND_PORT:-19800}}
    depends_on:
      - backend

  # Local LLM — off by default. Bring up later with:
  #   docker compose --profile local up -d ollama
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    ports:
      # Loopback only: the backend reaches it as http://ollama:11434 over the
      # compose network, so the host mapping is for debugging only.
      - "${INFRA_BIND:-127.0.0.1}:${OLLAMA_PORT:-19434}:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  qdrant_data:
  ollama_data:
  # Generated projects, one directory per project id. Shared by the backend,
  # the worker and the builder.
  workspaces:
  # Per-part pin tables, converted from the vendor data by `make devices`.
  # Also where a chip imported from the panel will land, which is why it is a
  # volume the backend can write to rather than something baked into an image.
  device_data:
  # ST's HAL/CMSIS sources, populated from the builder image. Delete it with
  # `make sdk-refresh` after rebuilding the image with different refs.
  cube_sdk:

networks:
  # Shared with the PageVault stack (the knowledge base, M2). PageVault keeps
  # its own database, Redis and Qdrant; the only thing crossing this network
  # is HTTP. Create it once before the first `docker compose up`:
  #
  #   docker network create rag-net
  #
  # See docs/knowledge-base.md.
  rag-net:
    external: true

  # Internal on purpose: this network has no gateway, so the build sandbox
  # can be called by the backend and the worker and can reach nothing else.
  build-net:
    internal: true
