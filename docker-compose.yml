services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stm32ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stm32ai}
      POSTGRES_DB: ${POSTGRES_DB:-stm32ai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stm32ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - default
      - rag-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  worker:
    build: ./backend
    # Agents query the knowledge base from inside the worker, so it needs the
    # shared network too. `-Q celery` is explicit on purpose: this worker must
    # only ever consume its own queue.
    command: celery -A app.workers.celery_app worker --loglevel=info -Q celery
    env_file: .env
    volumes:
      - ./backend:/app
    networks:
      - default
      - rag-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend

  # Local LLM — off by default. Bring up later with:
  #   docker compose --profile local up -d ollama
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  qdrant_data:
  ollama_data:

networks:
  # Shared with the PageVault stack (the knowledge base, M2). PageVault keeps
  # its own database, Redis and Qdrant; the only thing crossing this network
  # is HTTP. Create it once before the first `docker compose up`:
  #
  #   docker network create rag-net
  #
  # See docs/knowledge-base.md.
  rag-net:
    external: true
