# Attaches the PageVault stack to the shared `rag-net` network so the STM32
# assistant can reach it, WITHOUT modifying the PageVault repo.
#
# PageVault stays a standalone open-source project: on its own it still comes
# up with a plain `docker compose up` and knows nothing about STM32.
#
# Run it with this file added last:
#
#   docker network create rag-net           # once, ever
#   docker compose \
#     -f ../pagevault/docker-compose.yml \
#     -f ../pagevault/docker-compose.textrag.yml \
#     -f deploy/pagevault-rag.override.yml \
#     up -d
#
# Or simply: make kb-up
#
# Relative build contexts resolve against the FIRST -f file, so pointing at
# this file from another directory is safe.
#
# NOTE: this PageVault checkout declares its DEFAULT network as the external
# `rag-net`, so every PageVault service is already reachable on rag-net under
# its service name (api, postgres, redis, ...). The alias below therefore
# rides on the `default` key -- a second `rag-net:` key would collide with it
# in the merge and the alias would be silently dropped.

services:
  api:
    networks:
      default:
        aliases:
          # The hostname the STM32 backend uses (PAGEVAULT_URL). The service
          # name `api` is far too generic to depend on: it collides with any
          # other api-named container on the shared network.
          - pagevault-api
    ports:
      # Remapped: the STM32 backend already owns host port 8000. Inside the
      # network the port is still 8000, so PAGEVAULT_URL never changes.
      - "8100:8000"
